name: Reproduce analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile analysis/generate_figures.py

      - name: Reproduce numerical analysis
        run: python analysis/generate_figures.py

